name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.55.2
          args: --config .golangci.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      - name: Build
        run: |
          go build ./...
      - name: Run tests with coverage
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | awk '/^total:/ {print "Total coverage: " $3}'

  integration:
    runs-on: ubuntu-latest
    needs: build
    services:
      docker:
        image: docker:24.0-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
        options: >-
          --privileged
          --dns 8.8.8.8
          --dns 8.8.4.4
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      - name: Enable Docker environment
        env:
          DOCKER_HOST: tcp://localhost:2375
          DOCKER_TLS_CERTDIR: ""
        run: docker info
      - name: Run integration tests
        run: |
          DOCKER_HOST=tcp://localhost:2375 DOCKER_TLS_CERTDIR="" go test -tags=integration ./internal/repository/mysql ./internal/web
